version: "3.9"

services:
  api:
    build: .
    ports:
      - "8765:8765"
    environment:
      - DATABASE_URL=postgresql+asyncpg://auraquant:auraquant@db:5432/auraquant
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - qcore-net

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: auraquant
      POSTGRES_PASSWORD: auraquant
      POSTGRES_DB: auraquant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auraquant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qcore-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  qcore-net:
    driver: bridge
